sm_cvar sv_minrate 128000                     // Minimum value of rate.
sm_cvar sv_maxrate 128000                     // Maximum Value of rate.
sm_cvar sv_minupdaterate 128                 // Minimum Value of cl_updaterate.
sm_cvar sv_maxupdaterate 128                 // Maximum Value of cl_updaterate.
sm_cvar sv_mincmdrate 128                     // Minimum value of cl_cmdrate.
sm_cvar sv_maxcmdrate 128                     // Maximum value of cl_cmdrate.
sm_cvar sv_client_min_interp_ratio -1         // Minimum value of cl_interp_ratio.
sm_cvar sv_client_max_interp_ratio 0          // Maximum value of cl_interp_ratio.
sm_cvar nb_update_frequency 0.014             // The lower the value, the more often common infected and witches get updated (Pathing, and state), very CPU Intensive. (0.100 default; 0.024 = lowest before stuttering, was 0.014 = heavy FPS hit)
sm_cvar net_splitpacket_maxrate 128000         // Networking Tweaks.
sm_cvar net_maxcleartime 0.0001               // Caps the rate limiter's clear time (reduces self-introduced choke). Split fragments are paced by net_splitrate, not by this.
sm_cvar net_splitrate 4                       // Fragments of a split snapshot sent per frame (default 1). With 1, every extra fragment waits ~9.6 ms and the next snapshot is skipped at 128 tick.
sm_cvar sv_maxclientframes 512                // Delta history per client, in frames (default 128 = only 1 s at 128 tick; 512 = 4 s, like 30 tick).
sm_cvar sv_max_usercmd_future_ticks 34        // Default 8 ticks = 267 ms at 30 tick but 62 ms at 128; 34 restores ~267 ms.
sm_cvar sv_lagpushticks 0                    // No extra lagcomp rewind — required for low-ping hitreg.
sm_cvar fps_max 0                             // Forces the maximum amount of FPS the CPU has available for the Server.

