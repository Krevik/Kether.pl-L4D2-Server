// Prop Hunt - plugin loading, executed just before the matchmode finishes loading.

//-------------------------------------------
// Shared Plugins
//-------------------------------------------
exec cfgogl/prophunt/shared_plugins.cfg

// [witch_and_tankifier.smx] - hard-disable tank/witch (belt and suspenders alongside the
// versus_*_chance cvars in confogl.cfg).
confogl_addcvar sm_tank_can_spawn 0
confogl_addcvar sm_witch_can_spawn 0

// Shared Settings
exec cfgogl/prophunt/shared_settings.cfg
