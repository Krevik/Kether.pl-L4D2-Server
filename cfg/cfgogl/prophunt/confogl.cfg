// =======================================================================================
// Kether Prop Hunt - versus-based hide-and-seek gamemode
// Survivors are "Hunters" (seekers). Infected spawn as attack-disabled Hunters, then use
// +use to disguise as a world prop and try to survive the round without being found.
// See addons/sourcemod/scripting/kether/kether_prophunt.sp for the actual round logic - this
// matchmode only sets up the base engine/versus state the plugin runs on top of.
// =======================================================================================

// ReadyUp Cvars
l4d_ready_cfg_name "Prop Hunt"

// Confogl Cvars
confogl_addcvar mp_gamemode "versus"  // Required: human-controlled infected only exist in versus.
confogl_addcvar z_difficulty "normal"
confogl_addcvar confogl_pills_limit -1  // No item-spawn tracking needed for this mode.

// Prop Hunt Shared Cvars
exec cfgogl/prophunt/shared_cvars.cfg

// Config Cvars
exec cfgogl/prophunt/prophunt.cfg
