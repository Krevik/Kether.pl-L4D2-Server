// Prop Hunt - base plugin set. Deliberately lean compared to the competitive matchmodes
// (zonehunters/kether_versus_t1) - this is a casual gamemode with its own round/team logic.

//------------------------
// Sourcemod Basic Plugins
//------------------------
sm plugins load basebans.smx
sm plugins load basecommands.smx
sm plugins load basecomm.smx
sm plugins load admin-flatfile.smx
sm plugins load adminhelp.smx
sm plugins load adminmenu.smx
sm plugins load funcommands.smx
sm plugins load playercommands.smx

//------------------------
// Quality of life
//------------------------
sm plugins load optional/pause.smx
sm plugins load optional/playermanagement.smx
sm plugins load optional/specrates.smx
sm plugins load optional/autopause.smx

// [confogl_plugins.cfg counterpart - tank/witch spawn control]
sm plugins load optional/witch_and_tankifier.smx

// Letzzzz go. Reload confoglcompmod/match_vote here - "sm plugins unload_all" during
// RM_Match_Load()'s first pass wipes them out along with everything else, and only their
// own reload triggers the second pass that execs confogl.cfg and fires LGO_OnMatchModeLoaded.
// Without this, the mode never "goes live" and !chmatch/!fm stop working (see every other
// matchmode's shared_plugins.cfg, e.g. cfg/cfgogl/zonehunters/shared_plugins.cfg).
sm plugins load confoglcompmod.smx
sm plugins load match_vote.smx

//------------------------
// The gamemode itself
//------------------------
sm plugins load optional/kether/kether_prophunt.smx
