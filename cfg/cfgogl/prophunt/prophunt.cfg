// =======================================================================================
// Kether Prop Hunt - mode-specific plugin tuning.
// Most of these already match kether_prophunt.smx's own defaults (see
// addons/sourcemod/scripting/kether/prophunt/convars.sp) - they're listed here explicitly
// so admins have one obvious place to retune the mode without touching the plugin, and so
// the values revert cleanly via confogl_resetcvars when the mode is unloaded.
// =======================================================================================

confogl_addcvar ph_hunters                     4       // Hunters (survivor slots) picked each round; everyone else is a Prop.
confogl_addcvar ph_hide_time                   45.0    // Seconds Hunters are frozen+blinded while Props hide.
confogl_addcvar ph_round_time                  300.0   // Seek phase duration in seconds.
confogl_addcvar ph_guaranteed_hunter_turns      1       // Rounds a volunteer is guaranteed to play Hunter before rotating out.
confogl_addcvar ph_cue_interval                45.0    // Average seconds between forced special-infected sound cues.
confogl_addcvar ph_taunt_enabled                1       // Allow voluntary taunts (with cooldown).
confogl_addcvar ph_proplock_enabled             1       // Allow Props to lock/freeze their disguise in place.
confogl_addcvar ph_thirdperson                  1       // Allow Props to use thirdperson while disguised.
confogl_addcvar ph_anticheat_kick               1       // Kick clients caught with r_staticpropinfo enabled.

// Shared Settings
exec cfgogl/prophunt/shared_settings.cfg
