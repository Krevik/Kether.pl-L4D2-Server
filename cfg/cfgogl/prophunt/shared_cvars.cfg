// =======================================================================================
// Kether Prop Hunt - shared engine/versus cvars
// =======================================================================================

// --- Team sizes -------------------------------------------------------------------------
// The REAL knob for how many Hunters get picked each round is the plugin's own "ph_hunters"
// convar (see cfg/sourcemod/kether_prophunt.cfg / prophunt.cfg below) - the roster is
// entirely hand-managed by kether_prophunt.smx every round via ChangeClientTeam, not by the
// engine's own team-join/auto-balance flow. These two just need to be large enough that the
// engine itself never becomes the bottleneck:
confogl_addcvar survivor_limit 8         // Vanilla engine survivor team cap (see l4dtoolz 8v8 support already used elsewhere in this repo).
confogl_addcvar z_max_player_zombies 16  // Every connected player minus the Hunters can be a human Prop at once.
confogl_addcvar mp_autoteambalance 0
confogl_addcvar mp_teams_unbalance_limit 0
confogl_addcvar vs_max_team_switches 9999 // We swap people between teams every round - never let the engine cut that off.
confogl_addcvar versus_marker_num 0
confogl_addcvar sv_allow_lobby_connect_only 0

// --- No common infected, no AI specials/tank/witch --------------------------------------
// The whole point is "classic Prop Hunt on a versus map": nothing should attack a Prop
// except a Hunter's own observation. witch_and_tankifier.smx (loaded in confogl_plugins.cfg)
// additionally hard-disables tank/witch spawning at the SourceMod level.
confogl_addcvar z_common_limit 0
confogl_addcvar z_mega_mob_size 0
confogl_addcvar z_mob_spawn_min_size 0
confogl_addcvar z_mob_spawn_max_size 0
confogl_addcvar z_mob_spawn_min_interval_normal 3600
confogl_addcvar z_mob_spawn_max_interval_normal 3600
confogl_addcvar versus_tank_chance 0
confogl_addcvar versus_tank_chance_finale 0
confogl_addcvar versus_tank_chance_intro 0
confogl_addcvar versus_witch_chance 0
confogl_addcvar versus_witch_chance_finale 0
confogl_addcvar versus_witch_chance_intro 0

// --- Every human infected is forced into the Hunter (index 3) class by the plugin -------
// Block the other five classes at the engine level too, so nobody can win a class-vote
// race against L4D_SetClass() before the plugin gets to force it every round.
confogl_addcvar z_versus_hunter_limit 16
confogl_addcvar z_versus_boomer_limit 0
confogl_addcvar z_versus_smoker_limit 0
confogl_addcvar z_versus_jockey_limit 0
confogl_addcvar z_versus_charger_limit 0
confogl_addcvar z_versus_spitter_limit 0
confogl_addcvar z_ghost_delay_min 0      // Minimize any delay before L4D_MaterializeFromGhost can act at round start.
confogl_addcvar z_ghost_delay_max 0

// --- Props can never fight back (native-level backstop for the plugin's own damage hooks)
confogl_addcvar hunter_pz_claw_dmg 0
confogl_addcvar z_pounce_damage 0
confogl_addcvar z_pounce_damage_interval 1.0

// --- Misc ---------------------------------------------------------------------------------
confogl_addcvar sv_alltalk 1
confogl_addcvar confogl_enable_itemtracking 0  // No item-spawn tracking needed for this mode.

// Stripper: remove weapon/item spawns, rescue closets and changelevel/finale triggers so
// nothing can end the map or hand out gear mid-round. See cfg/stripper/prophunt/global_filters.cfg.
confogl_addcvar stripper_cfg_path cfg/stripper/prophunt
