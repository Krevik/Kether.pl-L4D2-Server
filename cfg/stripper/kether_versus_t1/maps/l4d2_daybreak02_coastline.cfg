; =====================================================
; ==     DAY BREAK SCRIPTABLE TANK/WITCH REMOVAL     ==
; ==  Remove map boss system; keep ZoneMod directors ==
; =====================================================
; Map uses tankspawn*/tanktrigger* + daybreak_boss_controller
; (same pattern as Dark Carnival Remix). Also strips
; daybreak_nobosses* so ProhibitBosses cannot block ZoneMod tanks.

filter:
{
	"classname" "info_zombie_spawn"
	"population" "Tank"
}
{
	"targetname" "/tankspawn.*/"
}
{
	"targetname" "/tanktrigger.*/"
}
{
	"targetname" "/witchspawn.*/"
}
{
	"targetname" "daybreak_boss_controller"
}
{
	"targetname" "tank_fire_immunity"
}

; Remove ProhibitBosses / boss-controller startup
modify:
{
	match:
	{
		"hammerid" "4766451"
	}
	delete:
	{
		"OnVersusPostIO" "daybreak_boss_controllerRunScriptCodeChooseRandomBossLocations()3-1"
		"OnVersusPostIO" "DirectorBeginScriptdaybreak_nobosses0-1"
		"OnCoopPostIO" "daybreak_boss_controllerRunScriptCodeChooseRandomBossLocations()3-1"
		"OnCoopPostIO" "DirectorBeginScriptdaybreak_nobosses0-1"
	}
}
{
	match:
	{
		"hammerid" "2871904"
	}
	delete:
	{
		"OnTrigger" "DirectorBeginScriptdaybreak_nobosses60.5-1"
	}
}
