; ############  NAV FLOW / VERSUS SCORE FIX  ###########
; Engine safe-area (L4D_OnFirstSurvivorLeftSafeArea) needs CHECKPOINT on start nav.
; Baked cp1 brushes are filtered above; apply a clean start CHECKPOINT box from
; in-game measurements (312 -712 16) to (755 -1203 89) — NOT removed at spawn.
add:
{
	"classname" "logic_auto"
	"OnMapSpawn" "h2h_nav_fix,Trigger,,0.05,-1"
	"OnMapSpawn" "h2h_nav_fix,Trigger,,0.5,-1"
}
{
	"classname" "logic_relay"
	"targetname" "h2h_nav_fix"
	"OnTrigger" "h2h_vs_player_start,ApplyNavAttributes,,0,-1"
