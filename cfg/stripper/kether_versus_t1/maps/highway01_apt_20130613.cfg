; =====================================================
; ========== [highway01_apt_20130613] [m1/5] [Highway To Hell]
; == Versus flow/score fix + skip coop intro (stripper only)
; =====================================================
;
; TAB score uses engine GetVersusCompletion (checkpoint state), !current uses nav m_flow.
; Baked func_nav cp1 (spawnflags 2176 = PLAYER_START+CHECKPOINT) marks the versus
; spawn as a goal checkpoint -> instant 400 on TAB. Must be removed BEFORE round start.
;
; Nav spawnflags (script/point_nav_attribute_region):
;   128  = PLAYER_START
;   2048 = CHECKPOINT
;   8192 = FINALE

; ############  REMOVE BAKED NAV BRUSHES  ##############
filter:
{
	"targetname" "cp1"
}
{
	"targetname" "cp2"
}
{
	"hammerid" "1569887"
}
{
	"hammerid" "1569911"
}
{
	"hammerid" "1623869"
}
; --- junk dev transition at start saferoom (map name highway01_apt05)
{
	"hammerid" "516433"
}

; ############  SKIP COOP INTRO  #######################
filter:
{
	"targetname" "relay_intro_start"
}
{
	"targetname" "relay_intro_setup"
}
{
	"targetname" "lcs_intro"
}
modify:
{
	match:
	{
		"classname" "info_director"
	}
	delete:
	{
		"OnGameplayStart" "relay_intro_start.Trigger..0.-1"
	}
}
; --- Versus spawn: single set of positions (readyup uses warp_to_start_area / freeze)
filter:
{
	"targetname" "survivorPos_intro_01"
}
{
	"targetname" "survivorPos_intro_02"
}
{
	"targetname" "survivorPos_intro_03"
}
{
	"targetname" "survivorPos_intro_04"
}
add:
; --- Versus-only survivor slots (cluster around info_landmark lvl1 ~400 -1070)
{
	"classname" "info_survivor_position"
	"targetname" "h2h_vs_spawn_0"
	"origin" "385 -1085 16"
	"angles" "0 90 0"
	"Order" "0"
	"GameMode" "versus"
}
{
	"classname" "info_survivor_position"
	"targetname" "h2h_vs_spawn_1"
	"origin" "415 -1085 16"
	"angles" "0 90 0"
	"Order" "1"
	"GameMode" "versus"
}
{
	"classname" "info_survivor_position"
	"targetname" "h2h_vs_spawn_2"
	"origin" "400 -1055 16"
	"angles" "0 90 0"
	"Order" "2"
	"GameMode" "versus"
}
{
	"classname" "info_survivor_position"
	"targetname" "h2h_vs_spawn_3"
	"origin" "430 -1055 16"
	"angles" "0 90 0"
	"Order" "3"
	"GameMode" "versus"
}

; ############  NAV FLOW / VERSUS SCORE FIX  #########
; Apply once before readyup caches flow/score (re-applying mid-round skews distance).
add:
{
	"classname" "logic_auto"
	"OnMapSpawn" "h2h_nav_fix,Trigger,,0.05,-1"
}
{
	"classname" "logic_relay"
	"targetname" "h2h_nav_fix"
	"OnTrigger" "h2h_vs_player_start,ApplyNavAttributes,,0,-1"
	"OnTrigger" "h2h_remove_spawn_checkpoint,ApplyNavAttributes,,0,-1"
	"OnTrigger" "h2h_remove_spawn_checkpoint_box,ApplyNavAttributes,,0,-1"
	"OnTrigger" "h2h_remove_near_spawn_checkpoint,ApplyNavAttributes,,0,-1"
	"OnTrigger" "h2h_remove_end_upper_checkpoint,ApplyNavAttributes,,0,-1"
	"OnTrigger" "h2h_remove_end_loft_checkpoint,ApplyNavAttributes,,0,-1"
	"OnTrigger" "h2h_vs_end_checkpoint,ApplyNavAttributes,,0,-1"
	"OnTrigger" "h2h_vs_end_checkpoint_box,ApplyNavAttributes,,0,-1"
	"OnTrigger" "h2h_remove_intro_player_start,ApplyNavAttributes,,0,-1"
	"OnTrigger" "h2h_remove_intro_nav_attrs,ApplyNavAttributes,,0,-1"
	"OnTrigger" "h2h_remove_wrong_finale,ApplyNavAttributes,,0,-1"
}
; --- Versus spawn saferoom: PLAYER_START only (~info_landmark lvl1)
{
	"classname" "script_nav_attribute_region"
	"targetname" "h2h_vs_player_start"
	"origin" "400 -1070 24"
	"extent" "220 260 120"
	"spawnflags" "128"
	"remove_attributes" "0"
}
; --- Strip CHECKPOINT from start saferoom (script region)
{
	"classname" "script_nav_attribute_region"
	"targetname" "h2h_remove_spawn_checkpoint"
	"origin" "400 -1070 24"
	"extent" "240 280 140"
	"spawnflags" "2048"
	"remove_attributes" "1"
}
