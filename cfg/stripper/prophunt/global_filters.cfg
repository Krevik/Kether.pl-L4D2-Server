; =====================================================
; ==            KETHER PROP HUNT - GLOBAL           ==
; == Strip anything that would let someone end the  ==
; == map, change loadouts mid-round, or otherwise    ==
; == break the "classic Prop Hunt" ruleset.          ==
; == Deliberately generic (by classname) rather than ==
; == per-map/hammerid, so it applies to every map on  ==
; == the rotation without extra per-map work.         ==
; =====================================================

; --- Nothing should be able to end the round/map. Rounds are entirely
; --- plugin-managed (kether_prophunt.smx), so any native way out has to go.
filter:
{
	"classname" "trigger_changelevel"
}
{
	"classname" "trigger_finale"
}
{
	"classname" "trigger_call_for_rescue"
}

; --- No weapon/item pickups: Hunters keep whatever loadout the round gave
; --- them and Props are meant to be permanently weaponless.
filter:
{
	"classname" "weapon_spawn"
}
{
	"classname" "weapon_melee_spawn"
}
{
	"classname" "weapon_item_spawn"
}
{
	"classname" "weapon_ammo_spawn"
}
