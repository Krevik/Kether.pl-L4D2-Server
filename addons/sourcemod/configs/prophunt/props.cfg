// Prop Hunt global prop rules, read by kether_prophunt.smx (scripting/kether/prophunt/propdata.sp).
//
// Matching order:
//   1) "Models"   - exact model path match (case-insensitive, forward slashes).
//   2) "Patterns" - regex against the full model path, first match wins, checked in file order.
//   3) If nothing matched, the prop is allowed subject to the ph_prop_min_size/ph_prop_max_size convars.
//
// A model that is blacklisted can never be selected. "offset" nudges the visual prop up/down
// (world units, applied along local Z) so e.g. thin props don't clip into the floor.
"PropHuntProps"
{
	"Models"
	{
		// Examples of per-model overrides. Add more as you find props worth tuning.
		"models/props_junk/mattress01_reference.mdl"
		{
			"blacklist"		"1"
		}
		"models/props_interiors/hospital_bed.mdl"
		{
			"offset"		"0 0 2"
		}
	}

	"Patterns"
	{
		// Gibs / ragdoll debris - never a real prop, spawned when things break.
		"gibs_dir"
		{
			"pattern"		"models/gibs/.*"
			"blacklist"		"1"
		}
		"gib_suffix"
		{
			"pattern"		".*_gib[0-9]*\.mdl$"
			"blacklist"		"1"
		}

		// Dev/placeholder reference meshes, not meant to be seen in-game.
		"reference_suffix"
		{
			"pattern"		".*_reference\.mdl$"
			"blacklist"		"1"
		}

		// Skybox-only geometry (huge scale, drawn outside the playable area).
		"skybox"
		{
			"pattern"		".*skybox.*\.mdl$"
			"blacklist"		"1"
		}

		// Character / corpse / infected models - disguising as one of these is confusing
		// and in the case of survivor models actively misleading for hunters.
		"survivors_dir"
		{
			"pattern"		"models/survivors/.*"
			"blacklist"		"1"
		}
		"infected_dir"
		{
			"pattern"		"models/infected/.*"
			"blacklist"		"1"
		}
		"player_dir"
		{
			"pattern"		"models/player/.*"
			"blacklist"		"1"
		}
		"deadbodies_dir"
		{
			"pattern"		"models/deadbodies/.*"
			"blacklist"		"1"
		}

		// Held weapon/world models and blood/puddle decals.
		"weapons_dir"
		{
			"pattern"		"models/weapons/.*"
			"blacklist"		"1"
		}
		"w_models_dir"
		{
			"pattern"		"models/w_models/.*"
			"blacklist"		"1"
		}
		"effects_dir"
		{
			"pattern"		"models/effects/.*"
			"blacklist"		"1"
		}
		"bloodpool"
		{
			"pattern"		".*bloodpool.*\.mdl$"
			"blacklist"		"1"
		}

		// Director-scripted breakwall/damage-model pieces, not static props.
		"damage_model_suffix"
		{
			"pattern"		".*_dm\.mdl$"
			"blacklist"		"1"
		}
		"breakwall"
		{
			"pattern"		".*infectedbreakwall.*"
			"blacklist"		"1"
		}
	}

	// Prop size limits are controlled at runtime by the ph_prop_min_size / ph_prop_max_size
	// convars (see cfg/cfgogl/prophunt/prophunt.cfg), not by this file.
}
